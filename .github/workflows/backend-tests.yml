name: Test backend

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build --wait

      - name: Run Go tests
        run: go test ./...

      - name: Run API tests
        run: bash tests/api_test.sh

      - name: Tear down services
        if: always()
        run: docker compose down -v
